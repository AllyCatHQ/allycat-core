name: Cross-Platform

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  smoke:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Version check
        run: node src/index.js --version

      - name: Quick scan — HTML fixture
        run: node src/index.js scan tests/fixtures/sample.html

      - name: Quick scan — exit code on critical violations
        run: node src/index.js scan tests/fixtures/fail-on-critical.html --fail-on-critical
        continue-on-error: true

      - name: E2E — exit code thresholds
        run: node tests/e2e/thresholds.test.js

      - name: E2E — concurrency ceilings
        run: node tests/e2e/concurrency.test.js

      - name: Path separator test (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          node src/index.js scan tests\fixtures\sample.html
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: BOM UTF-8 file test
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const c = '<html lang=\"en\"><head><title>t</title></head><body><img src=\"x\"></body></html>';
            fs.writeFileSync('/tmp/bom-test.html', '﻿' + c, 'utf8');
          "
          node src/index.js scan /tmp/bom-test.html
        if: runner.os != 'Windows'

      - name: BOM UTF-8 file test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const c='<html lang=""en""><head><title>t</title></head><body><img src=""x""></body></html>'; fs.writeFileSync(process.env.TEMP+'\\bom-test.html', '﻿'+c,'utf8');"
          node src/index.js scan "$env:TEMP\bom-test.html"

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Full scan — Playwright smoke test
        run: node src/index.js scan tests/fixtures/sample.html --full

      - name: E2E — CSS delivery (requires Playwright)
        run: node tests/e2e/css-delivery.test.js

      - name: Production install smoke test (no devDependencies)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TARBALL=$(npm pack --quiet)
          INSTALL_DIR=$(mktemp -d)
          cd "$INSTALL_DIR"
          npm install --omit=dev "$OLDPWD/$TARBALL"
          npx playwright install chromium --with-deps
          node_modules/.bin/allycat scan "$OLDPWD/tests/fixtures/sample.html" --full
